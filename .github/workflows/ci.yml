name: Gopher-Ops CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod — never drift between local + CI.
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v7+ is required for golangci-lint v2; v6 errors with
          # "invalid version string". Pin lint version too so silent
          # major bumps don't break the config schema.
          version: v2.12.2
          args: --timeout=5m

      - name: Unit tests
        run: go test -race -timeout 120s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate (≥ 20%)
        # Threshold sits a few points below current real coverage. Most pure
        # logic (config, snooze, audit search, parsers, fuzz inputs) IS
        # tested; the lower number reflects integration-heavy packages
        # (Docker socket, Gemini API, kubectl) that need real services to
        # cover. Raise this number deliberately as new tests land — never
        # lower it without a written reason.
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: $COVERAGE%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 20) { print "❌ Coverage below 20%"; exit 1 } else { print "✅ Coverage OK" } }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate
