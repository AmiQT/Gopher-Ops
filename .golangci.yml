# golangci-lint config. Strict but pragmatic — flags real bugs without
# drowning contributors in style noise.
#
# Run: `make lint`
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  disable-all: true
  enable:
    # Bug-catchers
    - errcheck         # unchecked errors
    - gosec            # security issues
    - govet            # suspicious constructs
    - ineffassign      # ineffective assignments
    - staticcheck      # broad static analysis
    - unused           # unused code
    - bodyclose        # http.Response.Body left open
    - nilerr           # returning nil after non-nil error check
    - rowserrcheck     # forgot to check sql.Rows.Err()
    - sqlclosecheck    # sql.Rows/Stmt not closed
    - contextcheck     # context.Background() inside a function with ctx param

    # Code-quality
    - gocritic         # opinionated checks
    - revive           # successor to golint
    - misspell         # typos in strings/comments
    - unconvert        # redundant type conversions
    - unparam          # unused function parameters

    # Style (light touch)
    - gofmt
    - goimports

linters-settings:
  gosec:
    excludes:
      - G104  # already covered by errcheck
      - G304  # file path provided as variable — needed for plugin paths

  revive:
    rules:
      - name: exported
        disabled: true   # too noisy for internal packages
      - name: unused-parameter
        disabled: true   # unparam handles this better

  gocritic:
    disabled-checks:
      - ifElseChain      # often unavoidable in switch-like dispatch
      - hugeParam        # we knowingly pass some big structs by value

  misspell:
    locale: US

issues:
  exclude-rules:
    # Tests can be more relaxed
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    # Generated/legacy main.go bits — none currently
  exclude-dirs:
    - terraform
    - assets
  max-issues-per-linter: 0
  max-same-issues: 0
